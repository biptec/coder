name: export-image-artifact

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing ghcr.io/biptec/coder image tag to export"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export amd64 image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="ghcr.io/biptec/coder:${{ inputs.image_tag }}"
          docker pull --platform linux/amd64 "$image"
          docker save "$image" | gzip -1 > coder-amd64.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: coder-amd64-${{ inputs.image_tag }}
          path: coder-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
